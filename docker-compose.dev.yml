name: stats-staging
services:
  server:
    build: ./server
    container_name: stats-server-staging
    hostname: stats-server-staging
    ports:
      - "8000:8000"
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./server:/app
      - ./server/data:/app/data
      - /opt:/opt:ro
      - /usr/share/ollama/.ollama:/usr/share/ollama/.ollama:ro
      - /sys:/sys:ro
      # RAPL energy counters (real power): Docker masks them under /sys, see collector.RAPL_ROOTS
      - /sys/devices/virtual/powercap/intel-rapl:/host/rapl:ro
      - /proc:/host/proc:ro
      - /mnt/ssdsata/backups:/mnt/ssdsata/backups:ro
    environment:
      # No Docker socket: read-only Docker API through docker-socket-proxy (see below).
      # Staging runs no backup worker, so backups are never written from staging.
      - DOCKER_HOST=tcp://docker-socket-proxy-staging:2375
      - API_KEY=${API_KEY:?API_KEY must be set in .env (e.g. openssl rand -hex 32)}
      - WATCHFILES_FORCE_POLLING=true
    command: uvicorn main:app --reload --reload-exclude "data/*" --reload-exclude "*.db" --host 0.0.0.0 --port 8000
    restart: always
    depends_on:
      - docker-socket-proxy
    networks:
      - proxy
      - docker-api
    labels:
      - "com.centurylinklabs.watchtower.enable=false"

  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:0.3.0
    container_name: docker-socket-proxy-staging
    environment:
      - CONTAINERS=1
      - SYSTEM=1
      - POST=0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - docker-api
    restart: always
    labels:
      - "com.centurylinklabs.watchtower.enable=false"

  client:
    build:
      context: ./client
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
    container_name: stats-client-staging
    ports:
      - "3000:3000"
    volumes:
      - ./client:/app
      - /app/node_modules
      - /app/.next
    environment:
      - BACKEND_API_URL=http://stats-server-staging:8000
      - NODE_ENV=development
      - ALLOWED_DEV_ORIGINS=${ALLOWED_DEV_ORIGINS:-dev.beskarfox.com,stats.staging.beskarfox.com,localhost,127.0.0.1}
      - WATCHPACK_POLLING=true
    command: npm run dev -- --webpack
    depends_on:
      - server
    restart: always
    networks:
      - proxy
    labels:
      - "com.centurylinklabs.watchtower.enable=false"
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      - "traefik.http.routers.stats-client-staging.rule=Host(`${TRAEFIK_CLIENT_HOST:-stats.staging.beskarfox.com}`)"
      - "traefik.http.routers.stats-client-staging.entrypoints=websecure"
      - "traefik.http.routers.stats-client-staging.tls=true"
      - "traefik.http.routers.stats-client-staging-web.rule=Host(`${TRAEFIK_CLIENT_HOST:-stats.staging.beskarfox.com}`)"
      - "traefik.http.routers.stats-client-staging-web.entrypoints=web"
      - "traefik.http.services.stats-client-staging.loadbalancer.server.port=3000"

networks:
  proxy:
    external: true
  docker-api:
    internal: true